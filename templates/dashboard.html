<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | AI Health Monitoring</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <h2>🩺 AI Health</h2>

    <ul>

        <li><a href="/">🏠 Home</a></li>

        <li><a href="/dashboard">📊 Dashboard</a></li>

        <li><a href="/camera">📷 Live Scan</a></li>

        <li><a href="/symptoms">🩺 Symptoms</a></li>

        <li><a href="/reports">📄 Reports</a></li>

        <li><a href="/analytics">📈 Analytics</a></li>

    </ul>

</div>


<div class="main">

    <div class="topbar">

        <h1>AI Health Dashboard</h1>

        <div class="user">

            Welcome

        </div>

    </div>


    <div class="cards">

        <div class="card">

            <h3>Health Score</h3>

            <h1 id="score">96%</h1>

        </div>

        <div class="card">

            <h3>Fatigue</h3>

            <h1 id="fatigue">Low</h1>

        </div>

        <div class="card">

            <h3>Stress</h3>

            <h1 id="stress">Normal</h1>

        </div>

        <div class="card">

            <h3>Mood</h3>

            <h1 id="mood">😊 Happy</h1>

        </div>

    </div>


    <div class="camera-box">

        <h2>Live Health Scanner</h2>

        <img
            src="{{ url_for('static', filename='images/camera_placeholder.png') }}"
            alt="Camera"
            class="camera">

    </div>


    <div class="analysis">

        <div class="analysis-card">

            <h3>Blink Count</h3>

            <h2 id="blink">0</h2>

        </div>

        <div class="analysis-card">

            <h3>Yawn Count</h3>

            <h2 id="yawn">0</h2>

        </div>

        <div class="analysis-card">

            <h3>Sleep Quality</h3>

            <h2 id="sleep">Good</h2>

        </div>

        <div class="analysis-card">

            <h3>Hydration</h3>

            <h2 id="water">Normal</h2>

        </div>

    </div>

</div>

</body>

</html>
